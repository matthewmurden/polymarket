# poly_lag_tracker config -- copy to config/local.ini (gitignored) and fill
# in your own values. CLI flags override anything set here; see --help.

# --- WebSocket ---
ws_url = wss://ws-subscriptions-clob.polymarket.com/ws/market
# Comma-separated token/asset ids to subscribe to. Leave blank and set
# auto_discover_assets = true below instead to have the tool pick currently
# active markets itself -- recommended, since high-volume markets (e.g. the
# BTC/ETH/XRP 5-minute up/down markets) churn every few minutes and a fixed
# list here goes stale fast. If both are set, asset_ids wins.
asset_ids =
reconnect_min_backoff_ms = 500
reconnect_max_backoff_ms = 30000
ping_interval_sec = 30

# --- Auto-discovery of active markets ---
# See README "Auto-discovering active markets" for how this works and why
# a resubscribe reconnects rather than patching the live connection.
auto_discover_assets = true
discover_trade_sample_size = 500
discover_top_n = 40
discover_refresh_interval_sec = 1800

# --- Polygon RPC ---
# Alchemy/Infura/public RPC. Public endpoints (e.g. a publicnode.com URL)
# work for light polling but rate-limit fast; use a dedicated provider key
# for a multi-day unattended run.
rpc_url =
rpc_timeout_ms = 8000
rpc_poll_max_attempts = 10
rpc_poll_interval_ms = 3000

# --- Trade -> on-chain matching ---
# Confirmed via a live payload capture: Polymarket's market-channel trade
# fills (event_type == "last_trade_price") carry a genuine transaction_hash
# field, so txhash is the correct default -- leave this as-is unless you've
# independently reconfirmed otherwise with --dump-raw-messages.
match_mode = txhash
# Only needed for match_mode = fuzzy or auto-with-fallback. Left blank
# deliberately -- see README "Fuzzy log-scan matching" before filling these
# in, a wrong value here silently produces wrong lag numbers.
exchange_contract_address =
order_filled_topic0 =
fuzzy_block_window = 50
fuzzy_price_tolerance_pct = 0.5
fuzzy_size_tolerance_pct = 0.5
polygon_avg_block_time_sec = 2.0

# --- Storage ---
output_path = poly_lag.csv
log_file = poly_lag_tracker.log
log_interval_sec = 300

# --- Concurrency ---
worker_threads = 4
queue_max_size = 5000

# --- Safety ---
force_unsynced_clock = false

# --- Raw payload inspection mode ---
dump_raw_messages = 0
dump_raw_path = raw_messages.jsonl

# --- Wallet resolution ---
# See README "Wallet address resolution" -- no config needed. Wallet
# addresses are decoded directly from the CTF Exchange V2 contract's
# OrderFilled event logs in the same eth_getTransactionReceipt call already
# made for on-chain confirmation above; always on whenever a receipt is
# available, nothing to tune or opt into.
